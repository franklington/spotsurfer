<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff700"/>
      <stop offset="40%"  stop-color="#ff8c00"/>
      <stop offset="70%"  stop-color="#ff1493"/>
      <stop offset="100%" stop-color="#b967ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <clipPath id="sunClip">
      <circle cx="256" cy="220" r="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="60"/>

  <!-- Grid lines -->
  <g stroke="#b967ff" stroke-width="1.5" opacity="0.45">
    <!-- horizontal -->
    <line x1="0"   y1="340" x2="512" y2="340"/>
    <line x1="0"   y1="380" x2="512" y2="380"/>
    <line x1="0"   y1="420" x2="512" y2="420"/>
    <line x1="0"   y1="460" x2="512" y2="460"/>
    <line x1="0"   y1="500" x2="512" y2="500"/>
    <!-- vertical perspective -->
    <line x1="256" y1="340" x2="0"   y2="512"/>
    <line x1="256" y1="340" x2="110" y2="512"/>
    <line x1="256" y1="340" x2="256" y2="512"/>
    <line x1="256" y1="340" x2="400" y2="512"/>
    <line x1="256" y1="340" x2="512" y2="512"/>
  </g>

  <!-- Retro sun -->
  <g clip-path="url(#sunClip)">
    <rect x="146" y="110" width="220" height="220" fill="url(#sun)"/>
    <!-- stripe cuts -->
    <rect x="146" y="220" width="220" height="7"  fill="#0d0d2b"/>
    <rect x="146" y="234" width="220" height="9"  fill="#0d0d2b"/>
    <rect x="146" y="250" width="220" height="11" fill="#0d0d2b"/>
    <rect x="146" y="268" width="220" height="14" fill="#0d0d2b"/>
    <rect x="146" y="289" width="220" height="17" fill="#0d0d2b"/>
    <rect x="146" y="313" width="220" height="17" fill="#0d0d2b"/>
  </g>

  <!-- Wave -->
  <path d="M40 310 Q110 270 180 310 Q250 350 320 310 Q390 270 470 310"
        fill="none" stroke="url(#wave)" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Surfer body -->
  <ellipse cx="200" cy="303" rx="15" ry="22" fill="#b967ff"/>
  <!-- Surfer head -->
  <circle  cx="200" cy="278" r="12" fill="#fff700"/>
  <!-- Surfboard -->
  <ellipse cx="205" cy="318" rx="40" ry="10" fill="#ff71ce"/>

  <!-- Title -->
  <text x="256" y="480" text-anchor="middle"
        font-family="'Courier New', monospace" font-weight="bold"
        font-size="48" fill="#ff00ff" letter-spacing="3">SPOT</text>
  <text x="256" y="480" text-anchor="middle"
        font-family="'Courier New', monospace" font-weight="bold"
        font-size="48" fill="#ff00ff" letter-spacing="3"
        opacity="0">SPOT</text>
</svg>
